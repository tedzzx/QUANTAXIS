[RQDATA]
# 复制本文件为 config/rqdatac.ini 后填写。请勿提交真实凭证。
#
# transport:
#   http = HTTPS rqdata.ricequant.com（默认，不依赖 16011）
#   tcp  = 官方 rqdatac 二进制端口 16011
transport = http
#
# 任选一种配置方式:
# 1) license / token（HTTP/TCP 均支持，账号名固定为 license）
# 2) username + password
# 3) uri（仅 tcp，形如 rqdata://user:pass@rqdatad-pro.ricequant.com:16011）
#
# 注意：license 不要加引号。

uri =
username =
password =
token =
license =
